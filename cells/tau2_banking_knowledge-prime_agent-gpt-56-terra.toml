# tau2_banking_knowledge x prime_agent @ gpt-5.6-terra
#
# One cell of the v0 matrix. Everything that distinguishes it from another cell is here, so
# the matrix is reviewable as data and a new experiment arm is a new file. The
# generation-effect study rides this same runner by varying instruction_arm alone.

[cell]
name = "tau2_banking_knowledge-prime_agent-gpt-56-terra"
env = "tau2_banking_knowledge"
harness = "prime_agent"
model = "gpt-5.6-terra"
# Effort is a cell axis: a different effort is a different cell file. v0 starts every base
# cell at xhigh. prime_agent exposes no effort control today; the field records the cell's
# intent and the harness ignores it until one exists.
effort = "xhigh"
# How many tasks may be live at once (shogym max_in_flight). Above 1 the agent holds
# several tasks, every env tool is lease-wrapped, and a pull at the limit displaces the
# oldest. v0 serves 8 so one-at-a-time is a choice the agent makes, not the only option.
max_in_flight = 8
split = "tau2_banking_knowledge"
instruction_arm = "get-better"
# Subscription is the preferred mode for every v0 cell. The runner supports both modes and
# records which one the cell actually ran under.
credential_mode = "subscription"
# OPENAI_API_KEY is the user simulator's, server-side; the pinned bm25_grep retrieval is local
# and adds no key of its own. TAU2_DATA_DIR is not listed here: the runner provisions the
# ~730 MB tau2 data into shogym's cache and points TAU2_DATA_DIR at it, rather than requiring
# the operator to export it. `uv run python tools/provision_tau2_data.py`.
required_env = ["OPENAI_API_KEY"]
note = "Our seeded 40/47 draw over the 87 of 97 tasks the env evaluator scores in full: banking declares no split, and 40 held-out matches telecom's so the two tau2 envs are read against the same held-out N. Served offline (bm25_grep retrieval, env-only evaluation), so these numbers are not comparable to published tau2-bench banking results."

[budget]
# Wall-clock parity, decided in the scope: identical across harnesses within an env, no token
# ceiling, because the cells run on subscription billing.
rollout_wall_clock_s = 28800
# The pool is a serving ceiling, not a quota. Stopping short of it is a reported outcome.
pool_ceiling = 47
# The backstop behind the drain watchdog, not the ordinary ending. A prime_agent leg has no
# terminal condition of its own (autonomous with no quality gate), so the watchdog ends it a
# couple of minutes after its held-out task seals and this is what catches a leg the watchdog
# could not reach. It leaves the measurement alone: pooled time-to-terminal p99 was 665s.
eval_task_timeout_s = 900

[env_kwargs]
# gpt-5.6-luna serves tau2's user simulator in place of upstream tau2-bench's canonical
# gpt-4.1-2025-04-14. Every tau2 cell carries this identical block, so they stay comparable to
# each other, but none of them is comparable to published tau2-bench results.
user_llm = "gpt-5.6-luna"

# tau2's evaluator restricted to its offline half: env scores DB state and env assertions, so a
# served run needs no judge LLM. It does not fall back to something weaker for a task whose
# basis it does not cover, it declines to score it, starting the reward at 1.0 and multiplying
# only for DB and ENV_ASSERTION. An ACTION-only task would therefore pass unconditionally. The
# split answers that by drawing only over the 87 tasks this evaluator scores in full.
evaluation_type = "env"

# Naming this table replaces tau2's DEFAULT_LLM_ARGS_USER wholesale, so both arguments have to
# appear here. reasoning_effort is required rather than optional: luna refuses any request
# carrying function tools unless it is set explicitly, and the user simulator always carries
# the banking user tools, so omitting it fails every user turn with a 400.
[env_kwargs.user_llm_args]
reasoning_effort = "none"
temperature = 0.0
