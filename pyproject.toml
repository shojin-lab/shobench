[project]
name = "shobench"
version = "0.0.1"
description = "A benchmark of agents from shared initial conditions: what they do, and when they choose to stop"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Jesson", email = "andrew.d.jesson@gmail.com" }]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shobench"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
