# The checks that cost nothing but runner minutes: ruff and the offline test suite.
#
# This workflow must never be able to spend money. It reads no secret, sets no provider key, and
# runs no cell, no eval, and no harness. The suite it runs holds to the same line: every test that
# would reach a network or a paid API skips itself instead, and the skip list is printed so a
# green run that skipped everything is visible rather than silent. If a step here ever needs a
# credential, it does not belong in this workflow.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # checkout stores its token in the local git config by default, where ruff or pytest
          # code from a pull request could read it back out. Nothing here pushes or calls the
          # API, so the checkout keeps no credential and the boundary stated above holds.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          # The action takes the job's token by default and holds it for the length of the step.
          # It attaches it to nothing but a download from github.com, and the pinned version comes
          # off Astral's mirror, so declining it costs this job nothing. The tradeoff sits on the
          # fallback path: if the mirror is unreachable, the retry against GitHub releases goes out
          # anonymously and shares the runner's rate limit. A slower cold install is the cheaper
          # thing to spend than a credential nothing here has a use for.
          github-token: ""
          # uv's download cache, keyed on the lock. shogym is a git dependency, so a cold cache
          # is a clone rather than a wheel pull. The cache service takes the runner's own token,
          # not the one declined above.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked, because drift is the thing --frozen does not look at: --frozen installs the lock
      # as written, so a dependency added to pyproject.toml and never locked is simply missing
      # from the environment and the job stays green without it. --locked checks the lock against
      # pyproject.toml and fails when the two disagree. The run steps below stay --frozen; the
      # gate has been passed by then, and re-resolving is not their job either.
      - run: uv sync --locked

      - run: uv run --frozen ruff check .

      # -rs names every skip. Nothing in the suite needs a provider, a docker daemon, or a
      # dataset; what is absent on a runner skips with a reason, and that reason is in the log.
      # The docker marker is what pyproject.toml already says it is, a test needing a live
      # daemon, and a runner has none. No test carries it today, so this deselects nothing and
      # says so in the summary line the day one does.
      - run: uv run --frozen pytest -q -rs -m "not docker"
