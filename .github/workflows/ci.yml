# The checks that cost nothing but runner minutes: ruff and the offline test suite.
#
# This workflow must never be able to spend money. No provider credential exists anywhere in this
# job: it reads no secret, sets no provider key, and runs no cell, no eval, and no harness. The
# suite it runs holds to the same line: it goes nowhere. The clients in it that would reach out on
# their own are pinned shut at import, in tests/conftest.py, and what a test needs and cannot find
# on the machine becomes a skip with a reason rather than a download. The skip list is printed, so
# a green run that skipped everything is visible rather than silent. A step here that needs a
# provider credential does not belong in this workflow.
#
# Two credentials are present, both issued by GitHub and both dead when the job ends. The job
# token, scoped by the permissions block below to reading this repository, is handed to
# actions/checkout, which fetches with it. The runner injects a separate cache-service token into
# every Node action, and the uv setup's cache runs on that one. Neither is a spend path, and
# neither reaches a step that runs repository code: the checkout is told not to leave its token in
# the git config, the uv setup is told to decline the job token it would otherwise be handed, and
# no later step is passed either. That is the true statement, and it is worth more here than the
# rounder claim that the job touches no credential at all.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The action fetches with the job token either way. What this changes is what happens
          # after: by default it writes that token into the local git config and leaves it there
          # for the rest of the job, where ruff or pytest code from a pull request could read it
          # back out. Nothing here pushes or calls the API, so the token's work ends with the
          # fetch and nothing that runs repository code inherits it.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          # The action takes the job's token by default and holds it for the length of the step.
          # It attaches it to nothing but a download from github.com, and the pinned version comes
          # off Astral's mirror, so declining it costs this job nothing. The tradeoff sits on the
          # fallback path: if the mirror is unreachable, the retry against GitHub releases goes out
          # anonymously and shares the runner's rate limit. A slower cold install is the cheaper
          # thing to spend than a credential nothing here has a use for.
          github-token: ""
          # uv's download cache, keyed on the lock. shogym is a git dependency, so a cold cache
          # is a clone rather than a wheel pull. The cache service takes the runner's own token,
          # not the one declined above.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked, because drift is the thing --frozen does not look at: --frozen installs the lock
      # as written, so a dependency added to pyproject.toml and never locked is simply missing
      # from the environment and the job stays green without it. --locked checks the lock against
      # pyproject.toml and fails when the two disagree. The run steps below stay --frozen; the
      # gate has been passed by then, and re-resolving is not their job either.
      - run: uv sync --locked

      - run: uv run --frozen ruff check .

      # -rs names every skip. Nothing in the suite needs a provider, a docker daemon, or a
      # dataset; what is absent on a runner skips with a reason, and that reason is in the log.
      # The docker marker is what pyproject.toml already says it is, a test needing a live
      # daemon, and a runner has none. No test carries it today, so this deselects nothing and
      # says so in the summary line the day one does.
      - run: uv run --frozen pytest -q -rs -m "not docker" --junitxml=$RUNNER_TEMP/pytest.xml

      # pytest exits 0 for a selection that skipped or deselected everything, so green can mean
      # nothing ran. The floor is a tripwire and not a target: it sits far below the suite's real
      # count and does not want raising as that count grows.
      - run: |
          uv run --frozen python - "$RUNNER_TEMP/pytest.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          executed = int(suite.get("tests")) - int(suite.get("skipped"))
          print(f"{executed} tests executed")
          if executed < 250:
              sys.exit(f"the suite executed {executed} tests, which is too few to call this a run")
          PY
